# Store screenshots for the Anthem Gym Timer rename. Capture only: nothing is
# signed, uploaded, or submitted. Runs on pushes to its own branch.
# The demo gym name "North Gym" is written into the app's own AsyncStorage on
# each simulator/emulator before launch (the app UI is the fallback).
name: Store screenshots

on:
  push:
    branches:
      - cursor/store-screenshots-anthem

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  COCOAPODS_DISABLE_STATS: "1"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TV: "1"
      EXPO_KEEP_ADAPTIVE_ICON: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - name: Build release APK (x86 + x86_64, debug-signed, TV build like Play/Fire TV)
        run: |
          set -euo pipefail
          npx expo prebuild --platform android
          cd android
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86,x86_64 --no-daemon
          APK=$(ls "$PWD"/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Android TV 1080p
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash store-capture/android-run.sh tv "$PWD/artifacts/android"
      - name: Android phone 1080x1920
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x1920
          script: bash store-capture/android-run.sh phone "$PWD/artifacts/android"
      - name: Android tablet 1920x1200
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1920x1200
          script: bash store-capture/android-run.sh tablet "$PWD/artifacts/android"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: artifacts/android/**
          retention-days: 14

  iphone:
    if: ${{ false }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.4 or newer
        run: |
          set -euo pipefail
          DEVELOPER_DIR=$(python3 scripts/ci-select-xcode.py)
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prebuild and build the iPhone app for the simulator
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios
          WORKSPACE=$(ls -d ios/*.xcworkspace | grep -v Pods | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          DD="$RUNNER_TEMP/dd"
          set -o pipefail
          FORCE_BUNDLING=1 RCT_NO_LAUNCH_PACKAGER=1 xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DD" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/xcodebuild-iphone.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/xcodebuild-iphone.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/xcodebuild-iphone.log"
          APP=$(find "$DD/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" || true
          xcrun simctl list devicetypes | grep -i iphone || true
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: iPhone 6.9-inch
        continue-on-error: true
        run: |
          bash store-capture/ios-run.sh iphone69 "$PWD/artifacts/iphone" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max
      - name: iPhone 6.5-inch
        continue-on-error: true
        run: |
          bash store-capture/ios-run.sh iphone65 "$PWD/artifacts/iphone" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus \
            com.apple.CoreSimulator.SimDeviceType.iPhone-13-Pro-Max \
            com.apple.CoreSimulator.SimDeviceType.iPhone-12-Pro-Max \
            com.apple.CoreSimulator.SimDeviceType.iPhone-11-Pro-Max
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-shots
          path: artifacts/iphone/**
          retention-days: 14

  appletv:
    if: ${{ false }}
    runs-on: macos-26
    timeout-minutes: 75
    env:
      EXPO_TV: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.4 or newer
        run: |
          set -euo pipefail
          DEVELOPER_DIR=$(python3 scripts/ci-select-xcode.py)
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prebuild the Apple TV app and add the UI test target
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios
          grep -Eq 'appletvos|appletvsimulator|TVOS_DEPLOYMENT_TARGET' ios/*.xcodeproj/project.pbxproj
          node scripts/wire-tvos-ui-test.mjs
      - name: Build for testing, seed North Gym, capture
        run: |
          set -uo pipefail
          mkdir -p artifacts/appletv
          UDID=$(python3 scripts/ci-select-tvos-udid.py)
          xcrun simctl list devices available | grep -i "apple tv" || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          WORKSPACE=$(ls -d ios/*.xcworkspace | grep -v Pods | head -n 1)
          SCHEME_FILE=$(grep -l AmericanaUITests ios/*.xcodeproj/xcshareddata/xcschemes/*.xcscheme | head -n 1)
          SCHEME=$(basename "$SCHEME_FILE" .xcscheme)
          DD="$RUNNER_TEMP/dd"
          FORCE_BUNDLING=1 RCT_NO_LAUNCH_PACKAGER=1 xcodebuild build-for-testing \
            -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk appletvsimulator -destination "id=$UDID" -derivedDataPath "$DD" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            COMPILER_INDEX_STORE_ENABLE=NO > artifacts/appletv/xcodebuild-build.log 2>&1
          status=$?
          tail -n 60 artifacts/appletv/xcodebuild-build.log
          [ "$status" -eq 0 ] || exit "$status"
          APP=$(find "$DD/Build/Products/Release-appletvsimulator" -maxdepth 1 -name '*.app' ! -name '*UITests*' | head -n 1)
          echo "app $APP"
          xcrun simctl install "$UDID" "$APP"
          DATA=$(xcrun simctl get_app_container "$UDID" com.garrettscales.americana data)
          mkdir -p "$DATA/Library/Caches/RCTAsyncLocalStorage_V1"
          python3 -c 'import json,sys; json.dump({"americana.branding.v1": json.dumps({"gymName": "North Gym"})}, open(sys.argv[1], "w"))' "$DATA/Library/Caches/RCTAsyncLocalStorage_V1/manifest.json"
          XCTESTRUN=$(ls "$DD"/Build/Products/*.xctestrun | head -n 1)
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$UDID" \
            -only-testing:AmericanaUITests/AmericanaRemoteUITests/testStoreScreenshots \
            -resultBundlePath "$PWD/artifacts/appletv/Store.xcresult" -parallel-testing-enabled NO \
            > artifacts/appletv/xcodebuild-test.log 2>&1
          echo "test exit $?"
          grep -E "APPLETV_STEP|error|Test Case" artifacts/appletv/xcodebuild-test.log | tail -n 40
          xcrun simctl io "$UDID" screenshot artifacts/appletv/final.png || true
          mkdir -p artifacts/appletv/attachments
          xcrun xcresulttool export attachments --path artifacts/appletv/Store.xcresult --output-path artifacts/appletv/attachments || true
          rm -rf artifacts/appletv/Store.xcresult
          ls -la artifacts/appletv/attachments | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appletv-shots
          path: artifacts/appletv/**
          retention-days: 14
