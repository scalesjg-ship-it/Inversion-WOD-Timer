# Signed Apple TV archive uploaded to TestFlight for internal testing.
#
# Manual only. A push to main must not build or upload a signed tvOS binary.
# The IPA stays on the runner and is deleted in the cleanup step. It is not a
# GitHub Actions artifact: this repository is public.
#
# Team is fixed to BNP9QFC679 (CrossFit Inversion LLC). The job refuses any
# other team, including PushPress. The App Store Connect app is 6833266123.
# Upload uses altool --upload-app. That hands the IPA to App Store Connect for
# TestFlight processing and does not submit the app for App Review or for
# external beta review.
name: Apple TV signed TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type UPLOAD to build a signed tvOS archive and send it to internal TestFlight
        required: true
        type: string

concurrency:
  group: appletv-signed-testflight
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  appletv-signed-testflight:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_TV: "1"
      COCOAPODS_DISABLE_STATS: "1"
      ASC_APP_ID: "6833266123"
      BUNDLE_ID: "com.garrettscales.americana"
      CONFIRM: ${{ inputs.confirm }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require an explicit UPLOAD confirmation
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "UPLOAD" ]; then
            echo "::error::Refusing to sign or upload. Re-run workflow_dispatch with confirm set to UPLOAD."
            exit 1
          fi

      - name: Check secrets and pin the Apple team
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::add-mask::${APPLE_CERTIFICATE_PASSWORD}"
          fi
          python3 scripts/ci-tvos-signing.py check-env

      - name: Select Xcode 26.4 or newer
        run: |
          set -euo pipefail
          DEVELOPER_DIR=$(python3 scripts/ci-select-xcode.py)
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild the Apple TV app
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios
          if ! grep -Eq 'appletvos|appletvsimulator|TVOS_DEPLOYMENT_TARGET' ios/*.xcodeproj/project.pbxproj; then
            echo "::error::expo prebuild did not produce a tvOS project"
            grep -nE 'SDKROOT|TARGETED_DEVICE_FAMILY|TVOS' ios/*.xcodeproj/project.pbxproj | head -n 40
            exit 1
          fi
          # Scheme and workspace are discovered the same way as the simulator
          # workflow: ios/*.xcworkspace (not Pods) and the shared Americana scheme.
          python3 scripts/ci-tvos-signing.py verify-prebuild --ios-dir ios --env-file "$RUNNER_TEMP/prebuild.env"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/prebuild.env"
          echo "Discovery matches appletv-simulator.yml: ios/*.xcworkspace and the shared scheme."
          ls -d ios/*.xcworkspace
          ls ios/*.xcodeproj/xcshareddata/xcschemes
          echo "workspace=$WORKSPACE scheme=$SCHEME"

      - name: Install the distribution certificate and tvOS profile
        run: bash scripts/ci-tvos-install-signing.sh

      - name: Apply manual signing to the Americana target
        run: |
          set -euo pipefail
          set -- ios/*.xcodeproj/project.pbxproj
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one app project.pbxproj under ios/, found $#."
            exit 1
          fi
          python3 scripts/ci-tvos-signing.py apply-signing --pbx "$1" --profile-name "$PROFILE_NAME"

      - name: Archive for appletvos
        run: |
          set -euo pipefail
          mkdir -p artifacts
          security unlock-keychain -p "$(cat "$SIGNING_DIR/keychain.password")" "$KEYCHAIN_PATH"
          ARCHIVE_PATH="$RUNNER_TEMP/Americana.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "Archiving $SCHEME from $WORKSPACE for generic/platform=tvOS"
          echo "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=BNP9QFC679 CODE_SIGN_IDENTITY=Apple Distribution"
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
          echo "CURRENT_PROJECT_VERSION=$TVOS_BUILD_NUMBER MARKETING_VERSION=$MARKETING_VERSION"
          # Pod targets keep CocoaPods' CODE_SIGNING_ALLOWED=NO, so this profile
          # is applied to Americana and not to the pods.
          xcodebuild -workspace "$WORKSPACE" -list
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$ARCHIVE_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            FORCE_BUNDLING=1 \
            RCT_NO_LAUNCH_PACKAGER=1 \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=BNP9QFC679 \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "CODE_SIGN_IDENTITY[sdk=appletvos*]=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER=com.garrettscales.americana \
            "CURRENT_PROJECT_VERSION=$TVOS_BUILD_NUMBER" \
            "MARKETING_VERSION=$MARKETING_VERSION" \
            | tee artifacts/xcodebuild.log

      - name: Export the App Store IPA
        run: |
          set -euo pipefail
          security unlock-keychain -p "$(cat "$SIGNING_DIR/keychain.password")" "$KEYCHAIN_PATH"
          EXPORT_PATH="$RUNNER_TEMP/tvos-export"
          rm -rf "$EXPORT_PATH"
          mkdir -p "$EXPORT_PATH"
          echo "EXPORT_PATH=$EXPORT_PATH" >> "$GITHUB_ENV"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            | tee artifacts/export.log
          ipa_count=$(find "$EXPORT_PATH" -name '*.ipa' -type f | wc -l | tr -d ' ')
          if [ "$ipa_count" -ne 1 ]; then
            echo "::error::Expected one IPA from export, found $ipa_count"
            exit 1
          fi
          IPA=$(find "$EXPORT_PATH" -name '*.ipa' -type f)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Exported $(basename "$IPA") for TestFlight upload. It will not be saved as an artifact."

      - name: Verify the signed tvOS build
        run: |
          set -euo pipefail
          IPA_UNPACK_DIR="$RUNNER_TEMP/tvos-ipa"
          rm -rf "$IPA_UNPACK_DIR"
          mkdir -p "$IPA_UNPACK_DIR"
          echo "IPA_UNPACK_DIR=$IPA_UNPACK_DIR" >> "$GITHUB_ENV"
          unzip -q "$IPA_PATH" -d "$IPA_UNPACK_DIR"
          app_count=$(find "$IPA_UNPACK_DIR/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')
          if [ "$app_count" -ne 1 ]; then
            echo "::error::Expected one .app in the IPA, found $app_count"
            exit 1
          fi
          APP=$(find "$IPA_UNPACK_DIR/Payload" -maxdepth 1 -type d -name '*.app')
          python3 scripts/ci-tvos-signing.py verify-built-app --app "$APP"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc-private-keys"
          python3 scripts/ci-tvos-signing.py write-api-key --dir "$KEY_DIR"
          export API_PRIVATE_KEYS_DIR="$KEY_DIR"
          echo "API_PRIVATE_KEYS_DIR=$KEY_DIR" >> "$GITHUB_ENV"
          for dir in "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"; do
            mkdir -p "$dir"
            cp "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" "$dir/"
            chmod 600 "$dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          done
          echo "Uploading build ${TVOS_BUILD_NUMBER} to App Store Connect app ${ASC_APP_ID} for TestFlight processing."
          echo "Team BNP9QFC679. This does not submit the app for App Review."
          # appletvos is the altool platform for an Apple TV IPA. -t ios is the
          # iPhone platform and is not used here. notarytool is not used.
          if xcrun --find altool >/dev/null 2>&1; then
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              -t appletvos \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --output-format xml \
              | tee artifacts/upload.log
          else
            echo "altool is not on this Xcode. Uploading with iTMSTransporter."
            xcrun iTMSTransporter \
              -m upload \
              -assetFile "$IPA_PATH" \
              -apiKey "$APP_STORE_CONNECT_KEY_ID" \
              -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              | tee artifacts/upload.log
          fi

      - name: Report the TestFlight upload
        run: |
          set -euo pipefail
          echo "Uploaded tvOS CFBundleVersion ${TVOS_BUILD_NUMBER} (${MARKETING_VERSION}) for ${BUNDLE_ID}."
          echo "App Store Connect app ${ASC_APP_ID}, team BNP9QFC679 (CrossFit Inversion LLC)."
          echo "TestFlight will process this as an internal build. It was not submitted for App Review or external beta review."
          {
            echo "## TestFlight upload"
            echo
            echo "- App: Americana (\`${BUNDLE_ID}\`)"
            echo "- App Store Connect app: ${ASC_APP_ID}"
            echo "- Team: BNP9QFC679 (CrossFit Inversion LLC)"
            echo "- Platform: tvOS"
            echo "- CFBundleVersion: ${TVOS_BUILD_NUMBER}"
            echo "- Version: ${MARKETING_VERSION}"
            echo "- Result: uploaded for TestFlight processing. Not submitted for App Review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare redacted log tails
        if: always()
        run: python3 scripts/ci-tvos-signing.py prepare-logs --source artifacts --dest artifacts/public-logs

      - name: Remove signing material and the IPA
        if: always()
        run: bash scripts/ci-tvos-cleanup-signing.sh

      - name: Upload non-sensitive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appletv-testflight-logs
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/public-logs/*.log
